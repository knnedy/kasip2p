services:
  - type: web
    name: kasip2p-signaling
    runtime: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @kasip2p/signaling build
    startCommand: node apps/signaling/dist/index.js
    envVars:
      - key: PORT
        value: 3001
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: "true"
